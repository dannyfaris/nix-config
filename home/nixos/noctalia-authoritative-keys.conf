# Noctalia authoritative-key manifest — the single source both guards read
# (docs/design/noctalia-config-surface-overlap.md §Design). These are the
# declared keys whose GUI override is a FAULT, not a preference: the
# pre-spawn reconcile (home/nixos/noctalia.nix) removes them from the
# sidecar at session start, and the audit (scripts/noctalia-config-audit.sh)
# flags them as forbidden. Everything declared and NOT listed here is
# seed-posture: the GUI legitimately overrides it.
#
# Format, one entry per line:
#   table <dotted.table.path>          — the whole table is authoritative
#   leaf <dotted.parent.table> <key>   — one key within a table
#
# Admission rule (the note's predicate): template enablement (trust
# surface), plus any declared leaf whose value is a store path — nobody
# tunes a store path in a GUI; its presence in the sidecar is only ever rot.
table theme.templates
leaf idle.behavior.suspend command
# hooks.colors_changed is a declared store path AND GUI-writable — the hooks
# family is registered dynamically per HookKind (settings_registry.cpp
# ~2833 at beta.8), invisible to literal extraction; stage-6 review
# finding 1. In the sidecar the GUI writes it under [hooks].
leaf hooks colors_changed
